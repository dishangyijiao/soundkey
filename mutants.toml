# Mutants that loop forever (a counter that no longer advances) are decided by the timeout.
# The baseline takes about 30 seconds, so twice that is enough and there is no need to wait 120.
timeout_multiplier = 2

exclude_re = [
    # Equivalent mutant: replacing `index + 1` with `index * 1` in fit_vocab only tries one more
    # empty string, and vocab_phones guarantees (with a test) that the vocabulary has no empty
    # token, so the result cannot change.
    "replace \\+ with \\* in fit_vocab",
]
