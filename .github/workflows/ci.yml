# Runs the same checks as `npm run coverage`. The gates themselves (100% coverage)
# are defined in package.json, so they are not repeated here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation links
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: python -m unittest tools.test_check_markdown_links
      - run: python tools/check_markdown_links.py

  extension:
    name: Extension (JS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run coverage:js

  server:
    name: Server (Rust)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The tests that depend on espeak-ng fail on purpose when it is missing.
      - run: brew install espeak-ng
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d  # stable branch
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad  # v2
        with:
          tool: cargo-llvm-cov
      # Runs every test, including the tests/cli.rs ones that bind a local port.
      - run: npm run coverage:rust
