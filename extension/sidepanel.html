<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>SoundKey</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main id="main">
      <section class="section">
        <div class="section-head">
          <h2>当前句</h2>
          <div id="status"><span id="dot"></span><span id="status-text">本机程序没开</span></div>
        </div>
        <p id="live-text" class="sentence"></p>
        <div class="live-bar">
          <span id="live-meta" class="meta"></span>
        </div>
        <div class="row">
          <button id="clip" class="secondary" type="button">摘下这句</button>
          <button id="live-play" class="secondary compact play" type="button">听原声</button>
        </div>
        <p id="live-hint" class="hint"></p>
      </section>

      <section class="section divider">
        <div class="section-head">
          <h2>这一句</h2>
          <button id="edit" class="text-button small" type="button">编辑</button>
        </div>
        <p id="card-sentence" class="sentence"></p>
        <textarea id="card-text" rows="2" hidden></textarea>
        <div id="score"></div>
        <div class="row" id="card-actions">
          <button id="read" class="primary record" type="button">朗读</button>
          <button id="card-play" class="secondary compact play" type="button">听标准音</button>
          <button id="mine" class="secondary compact play" type="button">听我的</button>
        </div>
        <button id="allow-mic" class="secondary" type="button" hidden>允许麦克风</button>
        <p id="read-hint" class="hint"></p>
      </section>

      <section class="section divider grow">
        <nav class="tabs">
          <button id="cards-tab" class="active" type="button">已摘</button>
          <button id="words-tab" type="button">生词</button>
        </nav>
        <ul id="list"></ul>
        <ul id="word-list" hidden></ul>
        <div class="paste">
          <input id="paste" type="text" placeholder="贴一句" />
          <button id="add" class="secondary compact" type="button">加入</button>
        </div>
      </section>
    </main>

    <section id="word-view" class="word-view" hidden>
      <div class="view-head">
        <button id="word-back" class="text-button" type="button">‹ 生词本</button>
        <button id="word-delete" class="text-button" type="button">删除</button>
      </div>
      <div class="word-hero">
        <h1 id="wv-word"></h1>
        <button id="wv-play" class="icon-button" type="button" title="朗读这个词"></button>
      </div>
      <p id="wv-ipa" class="ipa"></p>
      <p id="wv-def" class="definition"></p>

      <div class="block">
        <div class="section-head">
          <h2>音素</h2>
          <span class="legend"><i class="swatch vowel"></i>元音 <i class="swatch consonant"></i>辅音</span>
        </div>
        <div id="wv-phones" class="chips"></div>
      </div>

      <div class="block">
        <div id="wv-score"></div>
        <button id="wv-read" class="primary record" type="button">跟读</button>
        <div class="row" id="wv-actions">
          <button id="wv-mine" class="secondary compact play" type="button">听我的</button>
        </div>
        <p id="wv-hint" class="hint"></p>
      </div>

      <div class="block source" id="wv-source">
        <h2>出处</h2>
        <p id="wv-sentence" class="sentence small"></p>
        <button id="wv-source-play" class="secondary compact play" type="button">听原句</button>
      </div>
    </section>

    <div id="word-popover" class="popover" hidden></div>

    <script src="cues.js"></script>
    <script src="audio.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
