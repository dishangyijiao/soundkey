<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>讽诵</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <section class="section">
      <div class="section-head">
        <h2>当前句</h2>
        <div id="status"><span id="dot"></span><span id="status-text">本机程序没开</span></div>
      </div>
      <textarea id="live-text" rows="2"></textarea>
      <div class="live-bar">
        <span id="live-meta" class="meta"></span>
        <div class="adjust" id="adjust">
          <span class="adjust-label">前</span>
          <button id="start-more" type="button" title="向前多取一条字幕">＋</button>
          <button id="start-less" type="button" title="去掉最前一条字幕">－</button>
          <span class="adjust-label">后</span>
          <button id="end-less" type="button" title="去掉最后一条字幕">－</button>
          <button id="end-more" type="button" title="向后多取一条字幕">＋</button>
          <button id="reset-cue" type="button" title="恢复自动断句">还原</button>
        </div>
      </div>
      <div class="row">
        <button id="clip" class="secondary" type="button">摘下这句</button>
        <button id="live-play" class="text-button" type="button">听原声</button>
      </div>
      <p id="live-hint" class="hint"></p>
      <div id="word-popover" class="popover" hidden></div>
    </section>

    <section class="section divider">
      <h2>这一句</h2>
      <textarea id="card-text" rows="2"></textarea>
      <button id="read" class="primary" type="button">朗读</button>
      <button id="allow-mic" class="secondary" type="button" hidden>允许麦克风</button>
      <div id="score"></div>
      <div class="row" id="card-actions">
        <button id="card-play" class="text-button" type="button">听标准音</button>
        <button id="mine" class="text-button" type="button">听我的</button>
      </div>
      <p id="read-hint" class="hint"></p>
    </section>

    <section class="section divider grow">
      <nav class="tabs">
        <button id="cards-tab" class="active" type="button">已摘</button>
        <button id="words-tab" type="button">生词</button>
      </nav>
      <ul id="list"></ul>
      <ul id="word-list" hidden></ul>
      <div class="paste">
        <input id="paste" type="text" placeholder="贴一句" />
        <button id="add" class="text-button" type="button">加入</button>
      </div>
    </section>

    <script src="cues.js"></script>
    <script src="audio.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
